[package]
name = "tactical-zombie-td"
version = "0.1.0"
description = "3D Tactical Zombie Tower Defense - Lightweight Tauri Desktop Wrapper"
authors = ["Tactical TD Team"]
edition = "2021"

[lib]
name = "tactical_zombie_td_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
